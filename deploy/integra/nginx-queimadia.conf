# Servidor do Integra: o QueimadIA é só um conjunto de arquivos estáticos
# (HTML, JS, JSON e PNG) enviados pelo Mac do NIPED. Nada roda no servidor.
# Incluir dentro do bloco "server { ... }" de integra.dptc.am.gov.br, ANTES do "location /".
location = /queimadia { return 301 /queimadia/; }
location /queimadia/ {
    alias /var/www/queimadia/;
    index index.html;
    try_files $uri $uri/ =404;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    location ~* \.json$ { add_header Cache-Control "no-cache"; }      # dados mudam a cada 10 min
    location ~* \.png$  { add_header Cache-Control "public, max-age=604800"; }
}
