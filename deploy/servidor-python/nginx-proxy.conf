# Incluir dentro do bloco "server { ... }" de integra.dptc.am.gov.br,
# ANTES do "location /" do Integra. Publica o sistema em /queimadia/.
location = /queimadia { return 301 /queimadia/; }
location /queimadia/ {
    proxy_pass http://127.0.0.1:8090/;          # a barra final remove o prefixo /queimadia
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;                     # análises de NDVI podem levar alguns minutos
    client_max_body_size 5m;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
}
