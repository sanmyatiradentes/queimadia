# Atualiza os dados do QueimadIA a cada 10 minutos e publica no ramo `dados`,
# de onde o painel na Vercel lê os JSON (raw.githubusercontent.com).
name: Atualizar dados
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: atualizar-dados
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: motor/requirements.txt
      - run: pip install -r motor/requirements.txt
      - name: Restaurar estado do motor
        uses: actions/cache/restore@v4
        with:
          path: |
            motor/dados
            public/dados
          key: estado-${{ github.run_id }}
          restore-keys: estado-
      - name: Ciclo de atualização
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          MIN=$(date -u +%M)
          if [ "$MIN" -lt 10 ] || [ ! -f motor/dados/estado/status.json ]; then
            python -m motor.atualizar
          else
            python -m motor.atualizar --rapido
          fi
      - name: Guardar estado do motor
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            motor/dados
            public/dados
          key: estado-${{ github.run_id }}
      - name: Publicar no ramo dados
        run: |
          cd public/dados
          git init -q -b dados
          git config user.name "QueimadIA"
          git config user.email "queimadia@users.noreply.github.com"
          git add -A
          git commit -q -m "dados $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dados
