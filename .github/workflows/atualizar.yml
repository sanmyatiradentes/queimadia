# Atualiza os dados do QueimadIA a cada 10 minutos e envia para o Vercel Blob,
# de onde o painel publicado na Vercel lê os dados.
name: Atualizar dados
# Ciclo encadeado: ao terminar, cada execução espera completar 10 min desde o
# início e dispara a próxima (workflow_dispatch). O agendamento a cada 30 min é
# só reserva, para religar a corrente se ela cair; a fila (concurrency) impede
# execuções duplicadas.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
concurrency:
  group: atualizar-dados
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Marcar início
        run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: motor/requirements.txt
      - run: pip install -r motor/requirements.txt
      - name: Restaurar estado do motor
        uses: actions/cache/restore@v4
        with:
          path: |
            motor/dados
            public/dados
          key: estado-${{ github.run_id }}
          restore-keys: estado-
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Recuperar análises já publicadas (se o estado não veio do cache)
        run: python -m motor.baixar_blob
      - name: Ciclo de atualização
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          MIN=$(date -u +%M)
          if [ "$MIN" -lt 10 ] || [ ! -f motor/dados/estado/status.json ]; then
            python -m motor.atualizar
          else
            python -m motor.atualizar --rapido
          fi
      - name: Enviar dados ao Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: bash motor/enviar_blob.sh
      - name: Guardar estado do motor
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            motor/dados
            public/dados
          key: estado-${{ github.run_id }}
      - name: Disparar o próximo ciclo (10 min após o início deste)
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ESPERA=$(( 600 - ($(date +%s) - INICIO) ))
          if [ "$ESPERA" -gt 0 ]; then echo "aguardando ${ESPERA}s"; sleep "$ESPERA"; fi
          gh workflow run atualizar.yml -R "${{ github.repository }}" --ref main
