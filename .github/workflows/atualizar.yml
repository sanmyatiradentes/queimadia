# Atualiza os dados do QueimadIA a cada 10 minutos e envia para o Vercel Blob,
# de onde o painel publicado na Vercel lê os dados.
name: Atualizar dados
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: atualizar-dados
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: motor/requirements.txt
      - run: pip install -r motor/requirements.txt
      - name: Restaurar estado do motor
        uses: actions/cache/restore@v4
        with:
          path: |
            motor/dados
            public/dados
          key: estado-${{ github.run_id }}
          restore-keys: estado-
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g vercel@59.12.0
      - name: Recuperar análises já publicadas (se o estado não veio do cache)
        run: python -m motor.baixar_blob
      - name: Ciclo de atualização
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          MIN=$(date -u +%M)
          if [ "$MIN" -lt 10 ] || [ ! -f motor/dados/estado/status.json ]; then
            python -m motor.atualizar
          else
            python -m motor.atualizar --rapido
          fi
      - name: Enviar dados ao Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: bash motor/enviar_blob.sh
      - name: Guardar estado do motor
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            motor/dados
            public/dados
          key: estado-${{ github.run_id }}
